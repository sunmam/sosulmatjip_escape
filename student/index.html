<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>소설 맛집 학생용(방탈출형)</title>
<meta name="description" content="소설 속 5개의 방을 문제로 탈출하며 맛있는 식탁을 차리는 학생용 화면">
<meta name="theme-color" content="#8E6CFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="소설 방탈출">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gowun+Dodum&display=swap">

<style>
:root{
  color-scheme: light;
  --paper:#EEF3FF; --paper2:#E2EAFF; --card:#FFFFFF; --ink:#1C1A3B; --muted:#5E5C82;
  --tang:#FF7A3D; --tang-d:#D9531A; --sun:#FFD23F; --sun-d:#E0A800; --mint:#23C4A2; --mint-d:#0E927A;
  --pink:#FF5C8A; --pink-d:#D8305F; --sky:#5AA9FF; --sky-d:#2A77D6; --grape:#8E6CFF;
  --wood:#E9A15B; --wood-d:#B8703A;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ui:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --line:2.5px solid var(--ink);
  --pop:4px 5px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(rgba(28,26,59,.09) 1.2px,transparent 1.4px);background-size:12px 12px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{padding-inline:16px;padding-block:14px 60px;max-width:1200px;margin:0 auto}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stack{display:grid;gap:12px}

/* ---------- comic primitives ---------- */
.card{background:var(--card);border:var(--line);border-radius:18px;box-shadow:var(--pop);padding:18px}
.btn{font-family:var(--ui);font-size:16px;border:var(--line);border-radius:14px;background:var(--card);padding:9px 16px;
  box-shadow:3px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
.btn.tang{background:var(--tang);color:#fff}
.btn.sun{background:var(--sun)}
.btn.mint{background:var(--mint);color:#fff}
.btn.pink{background:var(--pink);color:#fff}
.btn.sky{background:var(--sky);color:#fff}
.btn.sm{font-size:14px;padding:5px 11px;border-radius:10px;box-shadow:2px 3px 0 var(--ink)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.45;pointer-events:none}
label.fld{display:grid;gap:4px;font-family:var(--ui);font-size:14px}
input.in,select.in,textarea.in{width:100%;border:var(--line);border-radius:12px;padding:9px 12px;background:#fff;font-family:var(--body);font-size:15px}
textarea.in{resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:#fff}
.tag{font-family:var(--ui);font-size:13px;border:2px solid var(--ink);border-radius:8px;padding:0 8px;background:var(--sun)}
.lv-하{background:#C9F3E6}.lv-중{background:#FFE7A6}.lv-상{background:#FFC7D6}
.seg{display:inline-flex;border:var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:5px 11px;font-family:var(--ui);font-size:14px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:#fff;
  font-family:var(--ui);padding:10px 18px;border-radius:14px;z-index:90;transition:transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}

/* ---------- 3D logo ---------- */
.logo{font-family:var(--display);font-size:clamp(44px,11vw,92px);line-height:1;color:var(--sun);letter-spacing:.02em;
  -webkit-text-stroke:2px var(--ink);
  text-shadow:1px 1px 0 var(--tang),2px 2px 0 var(--tang),3px 3px 0 var(--tang),4px 4px 0 var(--tang-d),5px 5px 0 var(--tang-d),6px 6px 0 var(--tang-d),7px 7px 0 var(--ink),8px 9px 0 var(--ink)}
.logo.sm{font-size:30px;-webkit-text-stroke:1.5px var(--ink);text-shadow:1px 1px 0 var(--tang),2px 2px 0 var(--tang-d),3px 3px 0 var(--ink),4px 4px 0 var(--ink)}

/* ---------- landing ---------- */
.home{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:30px}
.home-in{display:grid;gap:22px;justify-items:center;text-align:center;max-width:760px}
.spool{font-size:64px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(4px 6px 0 rgba(28,26,59,.25))}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;width:100%;perspective:1000px}
.door{border:var(--line);border-radius:22px;padding:22px;text-align:left;box-shadow:6px 8px 0 var(--ink);transform:rotateY(-8deg) rotateX(4deg);transition:transform .25s;display:grid;gap:6px}
.door:nth-child(2){transform:rotateY(8deg) rotateX(4deg)}
.door:hover{transform:rotateY(0) translateY(-6px)}
.door b{font-family:var(--display);font-size:30px;font-weight:400}
.door .big{font-size:44px}

/* ---------- teacher ---------- */
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font-family:var(--ui);font-size:16px;border:var(--line);border-radius:12px 12px 4px 4px;background:var(--paper2);padding:6px 14px}
.tabs button.on{background:var(--sun);box-shadow:3px 3px 0 var(--ink)}
.save-dot{font-family:var(--ui);font-size:13px;color:var(--muted);margin-left:auto}
.grid2{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:center;gap:10px;margin-block:4px 14px;flex-wrap:wrap}
.sec-h h2{font-size:26px}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;perspective:900px}
.book{position:relative;border:var(--line);border-radius:6px 16px 16px 6px;padding:16px 14px 14px 26px;min-height:200px;display:flex;flex-direction:column;gap:6px;
  transform:rotateY(-14deg);transform-origin:left;transition:transform .3s;box-shadow:8px 8px 0 var(--ink)}
.book:hover{transform:rotateY(0) translateY(-4px)}
.book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:rgba(28,26,59,.22);border-right:2px solid var(--ink)}
.book h3{font-size:24px}
.book .by{font-family:var(--ui);font-size:14px}
.book .acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.book.sel{outline:4px dashed var(--ink);outline-offset:5px}

.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.ccard{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.ccard .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ccard .hd h3{font-size:26px}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchips .chip button{border:0;background:none;padding:0;font-size:14px;line-height:1}
.switch{display:inline-flex;align-items:center;gap:8px;font-family:var(--ui);cursor:pointer}
.switch i{width:52px;height:28px;border:var(--line);border-radius:999px;background:#ddd;position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .2s}
.switch.on i{background:var(--mint)}
.switch.on i::after{left:25px}
.linkbox{display:flex;gap:6px;align-items:center;background:var(--paper2);border:2px dashed var(--ink);border-radius:10px;padding:6px 10px;font-family:var(--ui);font-size:14px}
.linkbox code{font-family:ui-monospace,Consolas,monospace;font-size:14px}

.qlist{display:grid;gap:14px}
.qrow{display:grid;grid-template-columns:54px 1fr;gap:12px;background:var(--card);border:var(--line);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:12px}
.qnum{font-family:var(--display);font-size:22px;display:grid;place-items:center;border:var(--line);border-radius:12px;height:54px}
.qtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.qtools .scene{width:54px;text-align:center;font-size:20px;padding:4px}
.mcopt{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.mcopt input[type=radio]{width:22px;height:22px;accent-color:var(--mint)}
.oxpick button{font-family:var(--display);font-size:22px;width:56px}
.lvhead{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:8px;margin-top:6px}
@media (max-width:560px){.qrow{grid-template-columns:1fr}.qnum{height:40px}}

.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--ui);border:var(--line);border-radius:999px;padding:5px 14px;background:#fff}
.pill.on{background:var(--ink);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:#fff;border:var(--line);border-radius:14px;padding:10px 14px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--ui);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;perspective:700px;padding-top:10px}
.pod{display:grid;justify-items:center;gap:4px;text-align:center}
.pod .blk{width:100%;border:var(--line);border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--display);font-size:30px;color:#fff;
  transform:rotateX(12deg);transform-origin:bottom;box-shadow:inset -10px 0 0 rgba(0,0,0,.14),4px 0 0 var(--ink)}
.pod.p1 .blk{height:120px;background:var(--sun);color:var(--ink)}
.pod.p2 .blk{height:88px;background:var(--sky)}
.pod.p3 .blk{height:64px;background:var(--tang)}
.pod .nm{font-family:var(--ui);font-size:14px;line-height:1.2}
.pod .sc{font-size:12px;color:var(--muted)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;perspective:1100px}
.gcard{text-align:left;display:grid;gap:10px;transform:rotateX(8deg);transform-origin:bottom;transition:transform .25s}
.gcard:hover{transform:rotateX(0) translateY(-6px)}
.gcard h3{font-size:24px}
.avs{display:flex;flex-wrap:wrap;gap:4px}
.bar{height:12px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--mint) 0 8px,#4FDDBE 8px 16px)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.folder{position:relative;background:var(--sun);border:var(--line);border-radius:4px 16px 16px 16px;padding:18px 14px 14px;box-shadow:var(--pop);display:grid;gap:8px;margin-top:14px}
.folder::before{content:"";position:absolute;top:-16px;left:-2.5px;width:44%;height:16px;background:var(--sun);border:var(--line);border-bottom:0;border-radius:10px 10px 0 0}
.folder.act{background:#A8F0DD}.folder.act::before{background:#A8F0DD}
.folder h3{font-size:22px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:2px dashed rgba(28,26,59,.2)}
.srch{display:flex;gap:6px}
.srch input{width:90px}

/* avatar */
.av{--c:var(--sun);width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);display:inline-grid;place-items:center;font-size:22px;flex:none;
  background:radial-gradient(circle at 32% 28%,#fff 0 12%,transparent 13%),radial-gradient(circle at 50% 60%,var(--c),color-mix(in srgb,var(--c) 70%,#000));box-shadow:2px 3px 0 var(--ink)}
.av.lg{width:64px;height:64px;font-size:36px}
.av.xs{width:30px;height:30px;font-size:16px;box-shadow:1px 2px 0 var(--ink)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(28,26,59,.55);display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal-in{background:var(--paper);border:var(--line);border-radius:22px;box-shadow:8px 10px 0 var(--ink);width:min(1000px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.modal-in.narrow{width:min(440px,100%)}
.modal-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-hd h2{font-size:26px;flex:1}
.mstud{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:16px;height:16px;border-radius:5px;border:2px solid var(--ink);background:#fff;font-style:normal;font-size:10px;display:grid;place-items:center}
.dots i.ok{background:var(--mint)}.dots i.ok2{background:#9BE7D6}.dots i.no{background:var(--pink)}

/* ---------- food photos ---------- */
.fpic{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;background:#FFE9C7;border:3px solid #fff;
  box-shadow:0 0 0 2.5px var(--ink),0 8px 14px rgba(28,26,59,.28);filter:saturate(1.18) contrast(1.05)}
.femo{display:grid;place-items:center;font-size:clamp(28px,9vw,60px);line-height:1;container-type:inline-size}
.fpic.sq{border-radius:18px}

/* ---------- dining table (top view, big food) ---------- */
.tbl{position:relative;border:3px solid var(--ink);border-radius:26px;padding:18px 14px 20px;
  background:
    linear-gradient(90deg,rgba(255,92,138,.22) 50%,transparent 50%) 0 0/40px 40px,
    linear-gradient(0deg,rgba(255,92,138,.22) 50%,transparent 50%) 0 0/40px 40px,#FFF6F0;
  box-shadow:0 10px 0 var(--wood),0 10px 0 3px var(--ink),0 26px 22px rgba(28,26,59,.22);margin-bottom:22px}
.tbl-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:14px 12px;justify-items:center}
.dishw{width:100%;max-width:170px;display:grid;justify-items:center;gap:6px;transform:rotate(var(--r,0deg))}
.dishw .nm{font-family:var(--ui);font-size:14px;line-height:1.15;text-align:center;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dishw.new{animation:dropIn .7s cubic-bezier(.3,1.6,.5,1) both}
.tbl-empty{min-height:120px;display:grid;place-items:center;font-family:var(--ui);color:var(--muted);text-align:center}
.tbl-sm .tbl{padding:10px;border-radius:16px;box-shadow:0 6px 0 var(--wood),0 6px 0 2px var(--ink);margin-bottom:12px}
.tbl-sm .tbl-grid{gap:6px}
.tbl-sm .fpic{border-width:2px;box-shadow:0 0 0 1.5px var(--ink),0 3px 5px rgba(28,26,59,.25)}
.tbl-sm .tbl-empty{min-height:54px;font-size:13px}

/* ---------- 내 식탁 (항상 보이기) ---------- */
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:25;width:min(560px,calc(100% - 20px));
  display:flex;align-items:center;gap:10px;background:var(--card);border:var(--line);border-radius:20px;box-shadow:4px 5px 0 var(--ink);padding:8px 10px;text-align:left}
.tray-l{font-family:var(--ui);font-size:15px;line-height:1.1;flex:none;display:grid;gap:2px}
.tray-l b{font-family:var(--display);font-weight:400;font-size:22px}
.tray-foods{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 2px;min-height:56px;align-items:center}
.tray-foods::-webkit-scrollbar{display:none}
.tray-foods .fpic{width:50px;flex:none;border-width:2px;box-shadow:0 0 0 1.5px var(--ink),0 3px 5px rgba(28,26,59,.25)}
.tray-foods .femo{font-size:26px}
.tray-foods .none{font-family:var(--ui);font-size:13px;color:var(--muted)}
.tray .open{font-family:var(--ui);font-size:13px;flex:none;border:2px solid var(--ink);border-radius:10px;padding:4px 8px;background:var(--sun)}
.tray.bump{animation:bumpT .5s}
@keyframes bumpT{30%{transform:translateX(-50%) scale(1.06)}60%{transform:translateX(-50%) scale(.98)}}
.play-grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.play-grid>*{min-width:0}
.side-tbl{display:none}
@media (min-width:920px){
  .sapp.wide{max-width:1040px}
  .play-grid{grid-template-columns:minmax(0,1fr) minmax(0,440px);align-items:start;gap:28px}
  .side-tbl{display:block;position:sticky;top:calc(96px + env(safe-area-inset-top,0px))}
  .sapp.wide + .tray{display:none}
}
.side-tbl h2{font-size:24px;margin-bottom:10px}

/* ---------- 메뉴판 (교사) ---------- */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mfood{background:#fff;border:var(--line);border-radius:18px;box-shadow:3px 4px 0 var(--ink);padding:10px;display:grid;gap:6px;justify-items:center;text-align:center;position:relative}
.mfood .fpic{width:96px}
.mfood.off{opacity:.5}
.mfood.off .fpic{filter:grayscale(1)}
.mfood input.in{padding:4px 8px;font-size:14px;text-align:center}
.mfood .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:13px;line-height:1;padding:0}
.mfood .ph{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:13px;line-height:1;padding:0}
.qty{display:inline-flex;align-items:center;border:var(--line);border-radius:12px;overflow:hidden;background:#fff}
.qty button{border:0;background:var(--paper2);width:34px;height:32px;font-family:var(--display);font-size:18px}
.qty b{min-width:40px;text-align:center;font-family:var(--display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.tier-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.tier-h h3{font-size:22px}
.addfood{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:620px){.addfood{grid-template-columns:1fr;justify-items:stretch}.addfood .pv{justify-self:center}}
.addfood .pv{display:grid;gap:8px;justify-items:center}
.addfood .pv .fpic{width:140px}
.addfood .pv .fpic.wait{animation:pulse 1s infinite}
.cands{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.cands button{padding:0;border:0;background:none;width:40px;border-radius:50%}
.cands button.on{outline:3px solid var(--tang);outline-offset:2px}
.addfood .pv .cands .fpic{width:40px;border-width:1.5px;box-shadow:0 0 0 1.5px var(--ink)}
.qrbox{display:grid;place-items:center;background:#fff;border:var(--line);border-radius:18px;padding:18px}
.qrbox img,.qrbox canvas{width:min(70vw,300px)!important;height:auto!important;image-rendering:pixelated}

/* ---------- student ---------- */
.sapp{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 120px;min-height:100%}
.hud{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--line);border-radius:18px;padding:8px 12px;box-shadow:3px 4px 0 var(--ink);position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:15}
.hud .nm{font-family:var(--ui);font-size:16px;line-height:1.1}
.hud .sc{font-family:var(--display);font-size:24px;margin-left:auto;font-variant-numeric:tabular-nums}
.eps{display:flex;gap:4px;margin:12px 2px}
.eps i{flex:1;height:10px;border:2px solid var(--ink);border-radius:4px;background:#fff}
.eps i.ok{background:var(--mint)}.eps i.no{background:var(--pink)}.eps i.cur{background:var(--sun);animation:pulse 1s infinite}
.panel{background:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:6px 7px 0 var(--ink);overflow:hidden;position:relative}
.panel-top{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:3px solid var(--ink);background:var(--sun)}
.panel-top .ep{font-family:var(--display);font-size:18px}
.scene{position:relative;height:170px;display:grid;place-items:center;overflow:hidden;border-bottom:3px solid var(--ink);
  background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(28,26,59,.10) 0 3deg,transparent 3deg 10deg),radial-gradient(circle at 50% 55%,#FFF4C2,#FFD7BF)}
.scene-emo{font-size:92px;line-height:1;filter:drop-shadow(5px 7px 0 rgba(28,26,59,.3));animation:bob 2.6s ease-in-out infinite}
.sfx{position:absolute;top:12px;right:14px;font-family:var(--display);font-size:34px;color:var(--pink);-webkit-text-stroke:1.5px var(--ink);transform:rotate(10deg);
  text-shadow:3px 3px 0 var(--ink);animation:sfx .6s cubic-bezier(.2,1.6,.4,1) both .25s}
.sfx.l{left:14px;right:auto;top:auto;bottom:10px;transform:rotate(-8deg);color:var(--sky);font-size:24px}
.bubble{position:relative;margin:16px 14px 16px;padding:14px 16px;border:3px solid var(--ink);border-radius:22px;background:#fff;font-family:var(--ui);font-size:19px;line-height:1.45}
.bubble::before{content:"";position:absolute;top:-16px;left:38px;border:14px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bubble::after{content:"";position:absolute;top:-11px;left:41px;border:11px solid transparent;border-bottom-color:#fff;border-top:0}
.answers{display:grid;gap:12px;margin-top:18px}
.oxs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.key{font-family:var(--display);font-size:64px;line-height:1;padding:18px 0 14px;border:3px solid var(--ink);border-radius:20px;color:#fff;
  box-shadow:0 9px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.key:active{transform:translateY(7px);box-shadow:0 2px 0 var(--ink)}
.key.o{background:radial-gradient(circle at 30% 25%,#8CC6FF,var(--sky) 60%,var(--sky-d))}
.key.x{background:radial-gradient(circle at 30% 25%,#FF9DB8,var(--pink) 60%,var(--pink-d))}
.mc{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;text-align:left;font-family:var(--ui);font-size:17px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.mc:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.mc b{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:400;background:var(--sun)}
.mc:nth-child(2) b{background:#A8F0DD}.mc:nth-child(3) b{background:#FFC7D6}.mc:nth-child(4) b{background:#C8DEFF}
.shortbox{display:grid;gap:10px}
.shortbox textarea{min-height:90px;font-family:var(--ui);font-size:18px}
.hintline{font-family:var(--ui);font-size:14px;color:var(--muted);text-align:center}
.shake{animation:shake .45s}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock .btn{pointer-events:auto;font-size:18px;padding:10px 22px;border-radius:18px;background:var(--sun)}
.dock .cnt{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;font-size:14px;margin-left:6px}
.dock .btn.bump{animation:bump .5s}

.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.charb{display:grid;justify-items:center;gap:4px;padding:10px 4px;border:var(--line);border-radius:16px;background:#fff;font-family:var(--ui);font-size:13px;transition:transform .15s}
.charb.on{background:var(--sun);transform:translateY(-4px) rotate(-3deg);box-shadow:3px 5px 0 var(--ink)}
.gpick{display:flex;flex-wrap:wrap;gap:8px}
.gpick button{font-family:var(--ui);font-size:16px;border:var(--line);border-radius:12px;padding:8px 14px;background:#fff;box-shadow:0 4px 0 var(--ink)}
.gpick button.on{background:var(--mint);color:#fff;transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.cover{perspective:900px;display:grid;place-items:center;padding:12px 0 6px}
.cover-book{width:210px;aspect-ratio:.72;border:3px solid var(--ink);border-radius:6px 18px 18px 6px;background:linear-gradient(135deg,var(--tang),var(--pink));color:#fff;
  padding:22px 18px 18px 30px;display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:12px 12px 0 var(--ink);animation:bookin 1s cubic-bezier(.2,1.2,.4,1) both;transform-style:preserve-3d}
.cover-book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:rgba(0,0,0,.2);border-right:2px solid var(--ink)}
.cover-book h2{font-size:38px;line-height:1.05;-webkit-text-stroke:1px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.cover-book .by{font-family:var(--ui);font-size:17px}
.cover-book .emo{margin-top:auto;font-size:56px;text-align:right}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(28,26,59,.6);animation:fade .2s}
.burst{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none}
.burst .star{width:min(80vw,340px);aspect-ratio:1;display:grid;place-items:center;background:var(--sun);border:0;
  clip-path:polygon(50% 0,61% 22%,85% 10%,78% 36%,100% 45%,79% 58%,90% 84%,63% 76%,50% 100%,37% 76%,10% 84%,21% 58%,0 45%,22% 36%,15% 10%,39% 22%);
  animation:burst .9s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 0 0 var(--ink))}
.burst .star span{font-family:var(--display);font-size:clamp(40px,12vw,64px);color:var(--ink);transform:rotate(-8deg);text-align:center;line-height:1}
.burst .star small{display:block;font-size:.45em;color:var(--tang-d)}
.burst.retry .star{background:#C8DEFF}
.burst.pass .star{background:#FFC7D6}
.wipe{position:fixed;inset:0;z-index:65;pointer-events:none;background:var(--ink);animation:wipe .55s ease-in-out both}
.picker{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:8px 10px 0 var(--ink);width:min(640px,100%);max-height:calc(100% - 10px);overflow:auto;padding:16px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.picker-hd{display:grid;gap:4px;text-align:center;margin-bottom:12px}
.picker-hd .tier{justify-self:center}
.picker-hd h2{font-size:26px}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
@media (max-width:420px){.foods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.food{position:relative;border:2.5px solid var(--ink);border-radius:20px;background:#fff;padding:10px 8px 8px;display:grid;justify-items:center;gap:5px;
  box-shadow:0 6px 0 var(--ink);transition:transform .15s;font-family:var(--ui);font-size:15px;line-height:1.2;text-align:center}
.food:hover{transform:translateY(-4px) rotate(-1.5deg)}
.food .fpic{width:100%;max-width:130px}
.food .left{font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--sun)}
.food.gone{filter:grayscale(1);opacity:.55;pointer-events:none;box-shadow:0 2px 0 var(--ink);transform:translateY(4px)}
.food.gone::after{content:"품절";position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font-family:var(--display);font-size:26px;color:var(--pink-d);border:3px solid var(--pink-d);border-radius:8px;padding:0 6px;background:rgba(255,255,255,.88)}
.food .who{font-size:11px;color:var(--muted)}
.reveal{display:grid;justify-items:center;gap:14px;text-align:center;cursor:pointer;border:0;background:transparent;color:#fff}
.rays{position:absolute;width:min(130vw,640px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(rgba(255,210,63,.55) 0 10deg,transparent 10deg 20deg);animation:spin 8s linear infinite;z-index:-1;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.bigdish{position:relative;width:min(78vw,340px);animation:bigpop .9s cubic-bezier(.2,1.4,.4,1) both}
.bigdish .fpic{border-width:6px;box-shadow:0 0 0 4px var(--ink),0 16px 0 var(--ink),0 34px 44px rgba(0,0,0,.4)}
.bigdish .femo{font-size:min(40vw,170px)}
.bigname{font-family:var(--display);font-size:clamp(30px,9vw,44px);color:var(--sun);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 4px 0 var(--ink)}
.bigdesc{font-family:var(--ui);font-size:17px;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:6px 14px}
.tap{font-family:var(--ui);font-size:15px;animation:pulse 1.2s infinite}
.flyer{position:fixed;z-index:80;width:140px;pointer-events:none;transition:transform .75s cubic-bezier(.5,-0.3,.4,1),opacity .75s}
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:8px 10px 0 var(--ink);width:min(560px,100%);padding:16px;animation:pop .35s cubic-bezier(.2,1.4,.4,1);max-height:calc(100% - 10px);overflow:auto}
.sheet h2{font-size:26px;text-align:center}
.upg{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:75;pointer-events:none;background:var(--grape);color:#fff;font-family:var(--display);font-size:26px;border:3px solid var(--ink);border-radius:16px;padding:8px 18px;box-shadow:5px 6px 0 var(--ink);animation:upg 2.2s ease both;text-align:center;white-space:nowrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border:1.5px solid var(--ink);animation:fall linear forwards}
.endcard{display:grid;gap:14px;text-align:center}
.endcard .score{font-family:var(--display);font-size:72px;line-height:1;color:var(--tang);-webkit-text-stroke:2px var(--ink);text-shadow:5px 6px 0 var(--ink)}

@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.6) rotate(-3deg);opacity:0}}
@keyframes pulse{50%{opacity:.45}}
@keyframes shake{20%,60%{transform:translateX(-10px) rotate(-1deg)}40%,80%{transform:translateX(10px) rotate(1deg)}}
@keyframes sfx{from{transform:scale(0) rotate(-30deg)}}
@keyframes burst{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.1) rotate(6deg)}80%{transform:scale(1)}90%{opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes wipe{0%{clip-path:polygon(0 0,0 0,-20% 100%,-20% 100%)}50%{clip-path:polygon(0 0,120% 0,100% 100%,-20% 100%)}100%{clip-path:polygon(120% 0,120% 0,100% 100%,100% 100%)}}
@keyframes bigpop{0%{transform:scale(0) rotateY(-540deg)}70%{transform:scale(1.08) rotateY(20deg)}100%{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dropIn{0%{transform:translateY(-160px) scale(1.7) rotate(-20deg);opacity:0}100%{transform:rotate(var(--r,0deg))}}
@keyframes bump{30%{transform:scale(1.25) rotate(-5deg)}60%{transform:scale(.95)}}
@keyframes upg{0%{transform:translateX(-50%) scale(0)}12%{transform:translateX(-50%) scale(1.15)}20%,80%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-30px);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes bookin{from{transform:rotateY(-90deg) scale(.7)}}
@keyframes trFlip{from{transform:perspective(900px) rotateY(-100deg);opacity:0}}
@keyframes trZoom{0%{transform:scale(.15) rotate(-14deg);opacity:0}70%{transform:scale(1.05) rotate(2deg)}}
@keyframes trSlide{from{transform:translateX(120%) skewX(-14deg)}}
@keyframes trDrop{0%{transform:translateY(-130%) rotate(9deg)}65%{transform:translateY(4%) rotate(-2deg)}}
@keyframes trTwist{from{transform:perspective(900px) rotateX(95deg);opacity:0}}
@keyframes trCube{from{transform:perspective(900px) translateZ(-300px) rotateY(80deg);opacity:0}}
.tr-flip{animation:trFlip .7s cubic-bezier(.2,1.2,.4,1) both;transform-origin:left}
.tr-zoom{animation:trZoom .6s cubic-bezier(.2,1.2,.4,1) both}
.tr-slide{animation:trSlide .55s cubic-bezier(.2,1.1,.4,1) both}
.tr-drop{animation:trDrop .7s cubic-bezier(.3,1.2,.5,1) both}
.tr-twist{animation:trTwist .7s cubic-bezier(.2,1.2,.4,1) both;transform-origin:top}
.tr-cube{animation:trCube .7s cubic-bezier(.2,1.1,.4,1) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.cset>summary,details>summary{cursor:pointer;font-family:var(--ui);font-size:16px}
.cset{border-top:2px dashed rgba(28,26,59,.2);padding-top:10px}
.cname{font-family:var(--display);font-size:22px;padding:8px 12px}

/* ---------- 코스 상차림 (레벨별 줄) ---------- */
.tbl.course{display:grid;gap:12px;padding:14px 12px 16px}
.crow{display:grid;gap:8px;background:rgba(255,255,255,.72);border:2px dashed rgba(28,26,59,.28);border-radius:16px;padding:8px 8px 10px}
.clab{justify-self:start;font-family:var(--ui);font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:1px 10px}
.clab b{font-family:var(--display);font-weight:400;margin-left:2px}
.course .tbl-grid{gap:10px 8px}
.course .dishw{max-width:130px}
.course .dishw .nm{font-size:12px;padding:0 7px}
.tapme{cursor:pointer;transition:transform .15s}
.tapme:hover{transform:rotate(0) scale(1.06)}
/* 휴대폰에서 "내 식탁 크게"는 화면 가득 */
@media (max-width:600px){
  #tblsheet{padding:0;place-items:stretch}
  #tblsheet .sheet{width:100%;max-height:100%;height:100%;border-radius:0;border:0;box-shadow:none;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
  #tblsheet .sheet>.row{position:sticky;bottom:0;padding-top:10px;background:var(--paper);margin-top:auto}
}
/* PC 옆 식탁: 화면 높이에 맞추고 넘치면 스크롤 */
@media (min-width:920px){.side-tbl{max-height:calc(100vh - 110px);overflow:auto}}
/* 아래 트레이: 최근 음식을 겹쳐 쌓기 */
.tray-foods.stack{overflow:visible;gap:0}
.tray-foods.stack .fpic{width:48px}
.tray-foods.stack .fpic+.fpic{margin-left:-16px}
.tray-more{font-family:var(--display);font-size:16px;margin-left:6px;flex:none}
/* 음식 크게 보기 */
.dishzoom{display:grid;justify-items:center;gap:12px;text-align:center;border:0;background:transparent;color:#fff;cursor:pointer}
.dishzoom .bigdish{width:min(74vw,300px)}
/* 모바일 최적화: 트레이는 화면 안에서만, 문제 카드 머리줄은 줄바꿈 */
.panel-top{flex-wrap:wrap;row-gap:4px}
.tray{gap:8px;padding:6px 8px}
.tray-foods{min-width:0;overflow:hidden}
.tray-foods.stack{overflow:hidden}
.tray-foods.stack .fpic{width:44px}
.tray-foods.stack .fpic+.fpic{margin-left:-14px}
.tray .open{padding:4px 6px}
@media (max-width:380px){.tray-l{font-size:13px}.tray-l b{font-size:19px}.tray-foods.stack .fpic:nth-child(n+5){display:none}}
/* 식탁 도착 화면: 휴대폰에서 음식 한 줄 4개가 딱 맞게 */
@media (max-width:600px){
  .tbl.course{padding:10px 8px 12px;gap:10px;border-radius:20px}
  .crow{padding:6px 6px 8px}
  .course .tbl-grid{gap:8px 6px}
  .course .dishw .nm{font-size:11px;padding:0 5px}
  #tblsheet .sheet h2{font-size:22px}
}
/* 작은 휴대폰: 입장 화면 캐릭터 칸이 화면을 넘지 않게 */
.stack{grid-template-columns:minmax(0,1fr)}
.chars{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:400px){.chars{gap:6px}.charb{padding:8px 2px}.charb .av.lg{width:50px;height:50px;font-size:28px}}
/* 문제 탭: 늘 보이는 ＋ 문제 버튼 */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;font-size:18px;padding:12px 20px;border-radius:999px;box-shadow:4px 5px 0 var(--ink)}
.qlist{padding-bottom:10px}

/* ================= 소설 방탈출 ================= */
body{background-color:#F3EEFF}

/* 위쪽 방 지도 */
.er-map{display:flex;align-items:center;margin:12px 2px 10px;gap:0}
.dm{flex:none;display:grid;justify-items:center;gap:2px;width:44px}
.dm i{font-style:normal;width:34px;height:40px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:14px 14px 4px 4px;background:#fff;font-family:var(--display);font-size:16px;box-shadow:0 3px 0 var(--ink)}
.dm em{font-style:normal;font-family:var(--ui);font-size:9.5px;line-height:1;white-space:nowrap;color:var(--muted);max-width:52px;overflow:hidden;text-overflow:ellipsis}
.dm.done i{background:var(--mint);color:#fff}
.dm.cur i{background:var(--dc);color:#fff;animation:dmglow 1.2s ease-in-out infinite}
.dm.lock i{background:#E9E6F5;font-size:13px}
.dm.skip{opacity:.35}
.dm-path{flex:1;height:4px;min-width:6px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 9px);opacity:.35;margin-bottom:14px}
@keyframes dmglow{50%{transform:translateY(-3px);box-shadow:0 6px 0 var(--ink),0 0 0 5px rgba(255,210,63,.6)}}

/* 방 */
.er{display:grid;gap:12px}
.er-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.er-no{font-family:var(--display);font-size:14px;background:var(--dr);color:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:2px 8px;box-shadow:2px 3px 0 var(--ink)}
.er-title b{font-family:var(--display);font-weight:400;font-size:22px}
.er-keys{margin-left:auto;font-family:var(--display);font-size:18px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:1px 12px}
.er-box{position:relative;height:clamp(230px,62vw,330px);border:3px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:5px 6px 0 var(--ink);background:var(--w2)}
/* 천장·옆벽·바닥 (사다리꼴로 입체감) */
.er-ceil{position:absolute;inset:0 0 auto 0;height:12%;background:color-mix(in srgb,var(--w2) 70%,#000 12%);clip-path:polygon(0 0,100% 0,82% 100%,18% 100%)}
.er-lw,.er-rw{position:absolute;top:0;bottom:0;width:18%;background:
  repeating-linear-gradient(180deg,rgba(255,255,255,.18) 0 10px,transparent 10px 22px),color-mix(in srgb,var(--w2) 80%,#000 14%)}
.er-lw{left:0;clip-path:polygon(0 0,100% 12%,100% 74%,0 100%)}
.er-rw{right:0;clip-path:polygon(0 12%,100% 0,100% 100%,0 74%)}
.er-lw span,.er-rw span{position:absolute;top:34%;font-size:clamp(20px,6vw,32px);filter:drop-shadow(2px 3px 0 rgba(28,26,59,.3))}
.er-lw span{left:22%}.er-rw span{right:22%}
.er-back{position:absolute;left:18%;right:18%;top:12%;height:62%;overflow:hidden;
  background:radial-gradient(circle at 12px 12px,rgba(255,255,255,.55) 3px,transparent 3.5px) 0 0/24px 24px,linear-gradient(180deg,var(--w1),color-mix(in srgb,var(--w1) 85%,var(--w2)))}
.er-back::after{content:"";position:absolute;inset:auto 0 0 0;height:10%;background:color-mix(in srgb,var(--w2) 75%,#000 10%);border-top:2px solid rgba(28,26,59,.25)}
.er-floor{position:absolute;left:0;right:0;bottom:0;height:26%;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);

    }
    return{ok:true};
  }
  /* ---- 온라인: Apps Script ---- */
  async function pull(){
    if(LOCAL||pulling)return;pulling=true;
    try{
      const r=await (await fetch(API_URL+'?op=pull&since='+ver+(key?'&key='+encodeURIComponent(key):''),{cache:'no-store'})).json();
      if(!r.ok)throw new Error(r.error||'pull');
      const ks=Object.keys(r.docs||{});
      ks.forEach(p=>{if(r.docs[p]===null)delete all[p];else all[p]=r.docs[p]});
      ver=Math.max(ver,r.ver||0);
      if(!online){online=true;setNet(true)}
      if(ks.length)notify();
    }catch(e){if(online){online=false;setNet(false)}console.warn(e)}
    finally{pulling=false}
  }
  function setNet(ok){const d=$('#netdot');if(d)d.hidden=ok;if(!ok)toast('서버와 연결이 불안정해요. 잠시 후 자동으로 다시 이어져요.')}
  function loop(){clearTimeout(timer);timer=setTimeout(async()=>{await pull();loop()},document.hidden?Math.max(pollMs*4,12000):pollMs)}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!LOCAL){pull();loop()}});
  async function post(body){
    if(LOCAL){const res=body.op==='batch'?{ok:true,results:body.ops.map(applyLocal)}:applyLocal(body);lsave();notify();return res}
    // 먼저 화면에 반영(빠른 반응), 서버 결과로 다시 맞춤
    const optimistic=o=>{if(o.op==='set')all[o.path]=clone(o.data);else if(o.op==='update')all[o.path]=merge(all[o.path]||{},clone(o.data));else if(o.op==='delete')delete all[o.path]};
    if(body.op!=='claim'){(body.op==='batch'?body.ops:[body]).forEach(optimistic);notify()}
    let r;
    for(let i=0;i<3;i++){
      try{r=await (await fetch(API_URL,{method:'POST',body:JSON.stringify({...body,key})})).json();if(r.ok||r.error!=='busy')break}
      catch(e){r={ok:false,error:'network'}}
      await sleep(600+i*800);
    }
    if(r&&r.ok&&body.op==='claim'&&r.data)all[body.path]=r.data;
    if(!r||!r.ok){const err=new Error((r&&r.error)||'network');err.code=(r&&r.error)||'network';pull();throw err}
    pull();return r;
  }
  return{
    async init({poll=3000,teacherKey=''}={}){pollMs=poll;key=teacherKey;if(LOCAL){all=lload();return}await pull();loop()},
    setKey(k){key=k},
    on(fn){listeners.add(fn);return()=>listeners.delete(fn)},
    doc(p){return clone(all[p])},
    peek(p){return all[p]},
    coll(prefix){const out={};const pre=prefix+'/';for(const p in all){if(p.startsWith(pre)&&p.indexOf('/',pre.length)<0)out[p.slice(pre.length)]=all[p]}return out},
    refresh:pull,
    set:(path,data)=>post({op:'set',path,data}),
    update:(path,data)=>post({op:'update',path,data}),
    del:path=>post({op:'delete',path}),
    batch:ops=>post({op:'batch',ops}),
    claim:(path,food,qty,entry)=>post({op:'claim',path,food,qty,entry})
  };
})();

/* 학생에게 내는 순서 (소설마다 교사가 고름)
   level: 하→중→상, 같은 수준은 교사가 만든 순서 / levelMix: 하→중→상, 같은 수준 안에서 섞기 / all: 모든 문제 섞기
   섞을 때는 학생마다 다르게, 같은 학생은 다시 들어와도 같은 순서 */
const ORDER_MODES={level:'하→중→상 순서대로',levelMix:'하→중→상 + 유형(OX·단답·선다) 섞기',all:'모든 문제 무작위'};
function seededRand(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
function seededShuffle(a,rnd){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function orderedQs(novel,seed){
  const base=(novel&&novel.questions||[]).map((q,i)=>({...q,_i:i})).sort((a,b)=>(LVI[a.level]??0)-(LVI[b.level]??0)||a._i-b._i);
  const mode=(novel&&novel.order)||'level';
  if(!seed||mode==='level')return base;
  const rnd=seededRand(String(seed));
  if(mode==='all')return seededShuffle(base,rnd);
  return LV.flatMap(l=>seededShuffle(base.filter(q=>q.level===l),rnd)).concat(base.filter(q=>!LV.includes(q.level)));
}

function groupName(c,gid){const g=((c&&c.groups)||[]).find(x=>x.id===gid);return g?g.name:'모둠 없음'}
function classesSorted(){return Object.entries(S.classes).map(([id,c])=>({...c,id})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
const ROT=[-6,4,-2,7,-4,3,-7,5,-3,6];
/* 식탁: 작은 식탁(교사 보드)은 격자, 큰 식탁은 레벨별 "코스 상차림" 줄로 */
function tableHTML(list,{small=false,newest=-1,names=!small,max=0,emptyText='아직 빈 식탁이에요',tap=false}={}){
  let foods=(list||[]).map((t,i)=>({...tableFood(t),_i:i}));

  if(small){

  }

  return `<div><div class="tbl course">${rows.map(r=>`<div class="crow">

function checkAns(q,v){
  if(q.type==='ox')return v===q.answer;
  if(q.type==='mc')return Number(v)===Number(q.answer);
  const norm=s=>String(s||'').toLowerCase().replace(/[\s.,!?'"“”‘’·~\-()「」『』]/g,'');
  const val=norm(v);const alts=String(q.answer||'').split(/[\/|]/).map(norm).filter(Boolean);
  return alts.some(a=>val===a||(a.length>=2&&val.includes(a)&&val.length<=a.length+6));
}
async function sAnswer(v){

  else{if(q.type==='short'&&!String(v).trim()){toast('답을 입력해 주세요.');return}ok=checkAns(q,v)}

    $('#panel').classList.add('shake');await burst('retry','앗!','한 번 더!');ST.busy=false;sPlay('tr-zoom');

    const right=q.type==='ox'?q.answer:q.type==='mc'?`${Number(q.answer)+1}번 ${(q.choices||[])[q.answer]||''}`:String(q.answer||'').split('/')[0];

function tierItems(ti){return menuItems().filter(f=>(f.tier||0)===ti&&(+f.qty||0)>0)}

function pickTier(q){
  const t=pantryTaken();const tier=tierFor(q);

  if(left(tier))return tier;
  for(let d=1;d<5;d++){if(tier+d<5&&left(tier+d))return tier+d;if(tier-d>=0&&left(tier-d))return tier-d}
  return tier;
}

function sQs(){const n=sNovel();if(!n)return[];return orderedQs(n.order==='all'?{...n,order:'levelMix'}:n,ST.key)}
function roomQs(r){return sQs().filter(q=>tierFor(q)===r)}
function qDone(q){return !!(ST.me.answers||{})[q.id]}
function roomState(r){const l=roomQs(r);if(!l.length)return 'skip';if(l.every(qDone))return 'done';const c=sCur();return c&&tierFor(c)===r?'cur':'lock'}

/* 위쪽: 점수 + 5개 방 지도 */
function hud(){
  const me=ST.me;const sc=scoreOf(me);
  return `<div class="hud">${avatar(me.character)}<div class="nm">${esc(me.name)}<div class="muted" style="font-size:12px">${esc(className(sCls()))} · ${esc(groupName(sCls()||{},me.group))}</div></div><span id="netdot" class="tag" style="background:var(--pink);color:#fff" hidden>연결 끊김</span><div class="sc">${sc.score}<span style="font-size:14px">점</span></div></div>
   <div class="er-map" aria-label="탈출 지도">${ROOMS.map((R,r)=>{const s=roomState(r);return `<span class="dm ${s}" style="--dc:${R.door}" title="${r+1}번 방 · ${TIERS[r].name}"><i>${s==='done'?'✓':s==='lock'?'🔒':s==='skip'?'·':r+1}</i><em>${TIERS[r].name}</em></span>`}).join('<b class="dm-path"></b>')}</div>`;
}

/* 방 그리기 (벽·바닥·문·주인공) + 열쇠구멍 판 */
function roomHTML(r,{opening=false}={}){
  const R=ROOMS[r];const list=roomQs(r);const all=sQs();const cur=sCur();
  const doneN=list.filter(qDone).length;const open=opening||doneN===list.length;
  const locks=list.slice(0,10).map(q=>`<span class="dl${qDone(q)?' off':''}">${qDone(q)?'🔓':'🔒'}</span>`).join('')+(list.length>10?`<span class="dl more">+${list.length-10}</span>`:'');
  const kh=list.map(q=>{const a=(ST.me.answers||{})[q.id];const no=all.findIndex(x=>x.id===q.id)+1;
    const st=a?(a.ok?'ok':'pass'):(cur&&cur.id===q.id?'next':'later');
    return `<button class="kh st-${st}${ST.justOpened===q.id?' pop':''}" data-sact="kh" data-q="${esc(q.id)}" aria-label="${no}번 열쇠구멍 ${st==='ok'?'열림':st==='pass'?'정답 확인함':st==='next'?'지금 풀기':'잠김'}">
      <span class="kh-plate"><span class="kh-hole"></span>${st==='ok'?'<span class="kh-key">🗝️</span>':''}${st==='pass'?'<span class="kh-key">👀</span>':''}</span>
      <span class="kh-no">${no}</span><span class="kh-lab">${q.level} · ${TYPE[q.type]}</span>
      ${st==='next'?'<span class="kh-tap">TAP!</span>':''}${st==='ok'?'<span class="kh-badge">✓</span>':''}</button>`}).join('');
  return `<section class="er" style="--w1:${R.w1};--w2:${R.w2};--fl:${R.fl};--fl2:${R.fl2};--dr:${R.door}">
    <div class="er-title"><span class="er-no">ROOM ${r+1}</span><b>${TIERS[r].name}의 방</b><span class="er-keys">🔑 ${doneN}/${list.length}</span></div>
    <div class="er-box${opening?' opening':''}">
      <div class="er-ceil"></div><div class="er-lw"><span>${R.deco[0]}</span></div><div class="er-rw"><span>${R.deco[3]}</span></div>
      <div class="er-back">
        <span class="er-deco a">${R.deco[1]}</span><span class="er-deco b">${R.deco[2]}</span>
        <div class="er-lights">${'<i></i>'.repeat(9)}</div>
        <div class="er-door${open?' unlocked':''}">
          <div class="er-glow"></div>
          <div class="er-panel"><span class="er-sign">EXIT</span><span class="er-knob"></span><span class="er-locks">${locks}</span></div>
        </div>
      </div>
      <div class="er-floor"></div>
      <div class="er-hero${ST.justOpened?' cheer':''}">${avatar(ST.me.character,'lg')}<span class="er-shadow"></span></div>
    </div>
    <div class="kh-board"><div class="kh-hd">${open?'🎉 모든 열쇠구멍이 열렸어요!':'✨ 반짝이는 열쇠구멍을 눌러 문제를 풀어요'}</div><div class="kh-grid">${kh}</div></div>
  </section>`;
}

/* 첫 화면: 5개의 방 복도 */
function sIntro(){
  const n=sNovel();
  app.innerHTML=`<div class="sapp">${hud()}
   <div class="card er-intro">
     <div class="er-intro-t">🗝️ 「${esc(n.title)}」 속에 갇혔다!</div>
     <div class="er-corridor">${ROOMS.map((R,r)=>{const c=roomQs(r).length;return `<div class="cd${c?'':' empty'}" style="--dr:${R.door}"><div class="cd-door"><span>${r+1}</span></div><b>${TIERS[r].name}</b><small>${c?`열쇠구멍 ${c}개`:'통과'}</small></div>`}).join('')}</div>
     <ul class="er-rules">
       <li>🔑 방마다 있는 <b>열쇠구멍</b>을 눌러 문제를 풀어요.</li>
       <li>🍽️ 맞히면 그 방 레벨의 <b>음식</b>을 골라 내 식탁에 차려요.</li>
       <li>🚪 열쇠구멍을 모두 열면 <b>문이 열리고</b> 다음 방으로!</li>
       <li>😵 두 번 틀리면 정답을 보고 넘어가요 (점수·음식은 없어요).</li>
     </ul>
     <button class="btn tang" style="font-size:20px;padding:14px" data-sact="start">🚪 1번 방으로 입장 ▶</button>
   </div></div>${tray()}`;
}

/* 방 화면 (문제 창이 열려 있으면 함께) */
function sPlay(trans){
  const q=sCur();if(!q){ST.view='end';return sEnd()}
  const r=tierFor(q);if(ST.room==null)ST.room=r;
  app.innerHTML=`<div class="sapp wide"><div class="play-grid"><div>${hud()}${roomHTML(ST.room)}</div>${sideTable()}</div></div>${tray()}`;
  ST.justOpened=null;
  if(ST.lastTier!==ST.room){if(ST.lastTier!==-1){const u=document.createElement('div');u.className='upg';u.innerHTML=`🚪 ${ST.room+1}번 방 입장!<br>Lv.${ST.room+1} ${TIERS[ST.room].name}`;document.body.appendChild(u);setTimeout(()=>u.remove(),2300)}ST.lastTier=ST.room}
  if(ST.qOpen)openQ(trans,true);
}

/* 열쇠구멍 → 문제 창 (열쇠구멍으로 빨려 들어가듯 열림) */
function openQ(trans,instant,from){
  const q=sCur();if(!q)return;
  const all=sQs();const no=all.findIndex(x=>x.id===q.id)+1;const t=tierFor(q);
  const ans=q.type==='ox'?`<div class="oxs"><button class="key o" data-sact="ans" data-v="O" aria-label="O">O</button><button class="key x" data-sact="ans" data-v="X" aria-label="X">X</button></div>`
    :q.type==='mc'?(q.choices||[]).map((ch,k)=>`<button class="mc" data-sact="ans" data-v="${k}"><b>${k+1}</b><span>${esc(ch)}</span></button>`).join('')
    :`<div class="shortbox"><textarea class="in" id="s-short" placeholder="${q.open?'내 생각을 한 문장으로 써 보세요':'정답을 입력하세요'}"></textarea><button class="btn tang" style="font-size:18px" data-sact="ans-short">🔑 열쇠 넣기</button></div>`;
  const old=$('#qov');if(old)old.remove();
  const m=document.createElement('div');m.className='ov qov'+(instant?'':' zoomin');m.id='qov';
  if(from){m.style.setProperty('--ox',from.x+'px');m.style.setProperty('--oy',from.y+'px')}
  m.innerHTML=`<div class="qov-in" style="--dr:${ROOMS[t].door}">
    <div class="qov-hd"><span class="tag" style="background:${ROOMS[t].door};color:#fff">🔑 ${no}번 열쇠구멍</span><span class="tag" style="background:#fff">ROOM ${t+1}</span><span class="grow"></span><button class="btn sm" data-sact="kh-close">방으로 ✕</button></div>
    <div class="panel ${trans||'tr-zoom'}" id="panel">
      <div class="panel-top"><span class="ep">Q.${no}</span><span class="tag lv-${q.level}">${q.level}수준</span><span class="tag" style="background:#fff">${TYPE[q.type]}${q.open?' · 내 생각':''}</span><span class="grow"></span>${ST.tries?'<span class="tag" style="background:var(--pink);color:#fff">마지막 기회!</span>':''}</div>
      <div class="scene"><div class="scene-emo">${esc(q.scene||['📖','🔍','🧠'][LVI[q.level]||0])}</div><div class="sfx">${pick(SFX)}</div><div class="sfx l">${pick(SFX2)}</div></div>
      <div class="bubble">${esc(q.q)}</div>
    </div>
    <div class="answers" id="answers">${ans}</div>
    <p class="hintline" style="margin-top:12px;color:#fff">맞히면 🗝️ 열쇠 + Lv.${t+1} ${TIERS[t].name} 음식!</p>
  </div>`;
  document.body.appendChild(m);
}

/* 문제를 마친 뒤: 방으로 돌아가거나, 방을 다 풀었으면 문 열고 탈출 */
function nextQ(){
  ST.tries=0;const ov=$('#qov');if(ov)ov.remove();
  if(ST.qOpen&&ST.curQ)ST.justOpened=ST.curQ;
  ST.qOpen=false;ST.curQ=null;
  const cur=sCur();ST.view='play';
  if(!cur){ST.me.done=true;saveMe();return escapeDoor(true)}
  const r=tierFor(cur);
  if(ST.room!=null&&r!==ST.room)return escapeDoor(false,r);
  ST.room=r;sPlay();
}
async function escapeDoor(final,nextRoom){
  if(ST.room==null){ST.room=final?4:nextRoom}
  ST.busy=true;
  app.innerHTML=`<div class="sapp wide"><div class="play-grid"><div>${hud()}${roomHTML(ST.room,{opening:true})}</div>${sideTable()}</div></div>${tray()}`;
  const door=$('.er-door'),hero=$('.er-hero');
  await sleep(350);door&&door.classList.add('open');
  await sleep(750);hero&&hero.classList.add('walk');
  await sleep(950);
  await burst('',final?'대탈출!':'방 탈출!',final?'모든 방 클리어 🎉':`${ST.room+1}번 방 클리어`);
  const w=document.createElement('div');w.className='wipe';document.body.appendChild(w);
  await sleep(260);ST.busy=false;
  if(final){ST.view='end';sEnd();confetti()}else{ST.room=nextRoom;sPlay()}
  setTimeout(()=>w.remove(),300);
}

Object.assign(SA,{
  kh(b){
    if(ST.busy)return;const q=sCur();
    if(!q||b.dataset.q!==q.id){const done=(ST.me.answers||{})[b.dataset.q];toast(done?'이미 연 열쇠구멍이에요 🗝️':'반짝이는 열쇠구멍부터 풀어요! ✨');return}
    // 창을 닫았다 다시 열어도 남은 기회는 그대로
    const r=b.getBoundingClientRect();if(ST.curQ!==q.id)ST.tries=0;ST.qOpen=true;ST.curQ=q.id;
    const hero=$('.er-hero');if(hero){hero.classList.remove('hop');void hero.offsetWidth;hero.classList.add('hop')}
    setTimeout(()=>openQ(null,false,{x:r.left+r.width/2,y:r.top+r.height/2}),220);
  },
  'kh-close'(){if(ST.busy)return;const ov=$('#qov');if(ov)ov.remove();ST.qOpen=false}
});

(function boot(){
  const hash=(location.hash||'').slice(1);
  startStudent(hash.startsWith('s-')?hash.slice(2):null);
})();

</script>
</body>
</html>
